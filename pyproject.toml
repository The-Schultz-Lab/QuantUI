[build-system]
# setuptools_scm was listed here historically but never configured — there is
# no [tool.setuptools_scm] table and `version` below is static, so nothing
# consumed it. Dropped for the first PyPI release rather than shipping a
# build dependency that does nothing.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantui"
version = "0.6.1"
description = "An open-source frontend for DFT and post-HF quantum chemistry with PySCF"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    {name = "Jonathan Schultz", email = "nccu-schultz-lab@users.noreply.github.com"},
]
keywords = ["quantum chemistry", "DFT", "PySCF", "jupyter", "voila", "frontend", "computational chemistry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    # PyPI shows the licence from this classifier in the sidebar; the
    # [project] license table alone is not enough for the old-style display.
    "License :: OSI Approved :: MIT License",
    # PySCF is Linux/macOS only, so Windows users need the container. Saying so
    # in metadata means `pip` users see it before they hit an install failure.
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: Web Environment",
    "Framework :: Jupyter",
]

# Runtime dependencies carry MAJOR-version caps, not open floors (M-PYPI
# PYPI.2). QuantUI is installed by students as an application, not consumed as
# a library, so the usual "don't cap in a library" advice does not apply — a
# resolution conflict is a worse outcome for them than a slightly stale pin,
# but a silent break from a new major is worse still.
#
# The concrete motivation: Voila 0.5.x declares no upper bound on jupyterlab,
# so a fresh install already resolves a Lab newer than Voila was built against
# and logs federated-extension errors in the browser console (see GOTCHAS,
# "Voila 0.5.x does not bound JupyterLab"). Harmless today because the failing
# extension is Notebook's, which Voila does not use — but shipping an unbounded
# stack means the next major can break a student with no error we control.
#
# Caps are at the MAJOR boundary only: minor/patch updates still flow, and the
# bounds reflect what has actually been tested rather than pretending to more.
# Revisit when a new major of any of these is validated.
dependencies = [
    "jupyter>=1.0.0,<2",
    "ipywidgets>=8.0.0,<9",
    "notebook>=7.0.0,<8",
    "numpy>=1.24.0,<3",
    "requests>=2.28.0,<3",
    "py3Dmol>=2.0.0,<3",
    "matplotlib>=3.7.0,<4",
    "plotly>=5.0.0,<7",
    "plotlymol>=0.2.1,<1",
]

[project.urls]
# Rendered as the sidebar links on the PyPI project page. "Homepage" and
# "Source" are the two PyPI actually highlights; the rest appear under
# "Project links".
Homepage = "https://github.com/The-Schultz-Lab/QuantUI"
Source = "https://github.com/The-Schultz-Lab/QuantUI"
Documentation = "https://the-schultz-lab.github.io/QuantUI/"
Changelog = "https://github.com/The-Schultz-Lab/QuantUI/blob/main/CHANGELOG.md"
Issues = "https://github.com/The-Schultz-Lab/QuantUI/issues"

[project.scripts]
# ``quantui`` CLI — small toolkit for inspecting QuantUI state from
# the terminal (``quantui log tail -n 50``, etc.). See ``quantui/cli.py``.
quantui = "quantui.cli:main"

[tool.setuptools]
packages = ["quantui"]

[tool.setuptools.package-data]
# Bundled molecule library (M-STRUCT): the indexed SQLite store + the
# human-readable JSON manifests it is built from. Both ship in the wheel so
# offline structure lookup works on a fresh install.
# Vendored 3Dmol.js: py3Dmol fetches 3Dmol.js from a CDN by default, which
# fails offline; we ship the bundle so all 3D views render with no network.
quantui = [
    "data/library/*.sqlite",
    "data/manifests/*.json",
    "data/js/*.js",
    "data/js/*.txt",
]

[project.optional-dependencies]
# PySCF requires Linux/macOS/WSL — not available on Windows natively.
# Use the Apptainer container (apptainer/quantui.def) for Windows.
# pyscf.prop.infrared is NOT in pyscf/pyscf-properties as of pyscf 2.13 —
# freq_calc.py computes IR intensities itself via finite-difference dipole
# displacement instead (see the comment there). NMR is NOT accessed via
# pyscf.nmr (that module doesn't exist in released pyscf); it's
# pyscf.prop.nmr, provided by pyscf-properties below.
pyscf = [
    # .github/dependabot.yml already ignores pyscf MAJOR bumps ("may break
    # API — review manually"); this cap makes that policy binding for
    # installers too, not just for our dependency bot.
    "pyscf>=2.13.0,<3",
    "pyscf-properties",
]

# ASE: structure I/O, extended molecule library, geometry optimisation
ase = [
    "ase>=3.22.0,<4",
]

# Voilà app server — hides notebook code; students see only the widget UI.
# Run with: voila notebooks/molecule_computations.ipynb
app = [
    # Capped for the same reason as the runtime stack above: Voila is the
    # component whose own bounds are too loose, so ours have to hold the line.
    "voila>=0.5.0,<0.6",
    "ipykernel>=6.0.0,<8",
]

# GPU acceleration via gpu4pyscf + cupy (M-GPU). Linux + NVIDIA CUDA only.
# When installed, ``quantui.gpu_offload`` auto-detects + migrates SCF
# objects via ``mf.to_gpu()``. Set ``QUANTUI_DISABLE_GPU=1`` to force CPU
# at runtime even when these are available. Method coverage per the
# gpu4pyscf README: RHF/UHF/RKS/UKS fully supported; MP2/CCSD experimental;
# CCSD(T) explicitly unsupported (QuantUI's dispatcher skips it).
#
# IMPORTANT: gpu4pyscf and cupy publish CUDA-suffixed wheels — pick the
# extra matching your NVIDIA driver's CUDA version (see ``nvidia-smi``).
# The bare ``gpu4pyscf`` / ``cupy`` packages on PyPI are source sdists
# that require a local CUDA Toolkit (``nvcc``) to build; the suffixed
# wheels (``-cuda12x``, ``-cuda13x``) are prebuilt binaries and do NOT.
# See the "Optional: GPU acceleration" section in README.md for the
# full step-by-step including the ``nvidia-smi`` check.
gpu-cuda12x = [
    "gpu4pyscf-cuda12x",
    "cupy-cuda12x",
    "cutensor-cu12",
]
gpu-cuda13x = [
    "gpu4pyscf-cuda13x",
    "cupy-cuda13x",
    "cutensor-cu13",
]

# Notebook smoke-test dependencies
notebook = [
    "nbmake>=1.4.0",
    "ipykernel>=6.0.0,<8",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",  # parallel test execution (-n=auto in addopts)
    "mypy>=1.0.0",
    "types-requests>=2.28.0",
    # Formatter/linter versions are pinned to a compatible range, NOT an open
    # floor: they must agree with the revs in .pre-commit-config.yaml, which is
    # what CI enforces. With open floors a fresh `pip install` pulls whatever is
    # newest and a bare `ruff check` reports rules CI never sees (M-CLEAN CLEAN.2).
    #
    # black is split by Python version: 26.x requires >=3.10, but requires-python
    # here is >=3.9 and 3.9 is in the CI matrix, so an unconditional ~=26.5.1
    # makes the dev extra uninstallable on 3.9. 25.11.0 is the last black that
    # supports 3.9. Consequence to know: a developer on 3.9 formats with 25.11 and
    # could differ slightly from CI — CI's authority is the pinned pre-commit rev,
    # whose lint job runs on 3.11, so run `pre-commit run` before pushing if you
    # develop on 3.9. (ruff 0.16 needs only >=3.7, so it needs no split.)
    "black~=26.5.1; python_version >= '3.10'",
    "black~=25.11.0; python_version < '3.10'",
    "ruff~=0.16.0",
    "pre-commit>=3.7.0",
]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports, etc.)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernise syntax)
    "B",   # flake8-bugbear (common bug patterns)
]
ignore = [
    "E501",  # line too long — black handles this
    "B008",  # function calls in default args — common in teaching code
    # The rules below fire on verbatim-copied source files that we don't
    # want to diverge from the upstream QuantUI repo unnecessarily.
    # They are style-only and do not affect correctness.
    "UP006",  # use built-in dict/list/tuple for annotations (requires 3.9 runtime)
    "UP007",  # use X | Y for unions (requires 3.10 at runtime)
    # UP045 is the Optional[X] -> X | None half of UP007, which newer ruff split
    # into its own code. Ignored on exactly the same grounds as UP007 above:
    # requires-python is >=3.9 and 3.9 is in the CI matrix. Without this entry a
    # ruff upgrade silently un-ignores a rule the project already decided against
    # (205 sites), which is what happened when the pins drifted (M-CLEAN CLEAN.2).
    "UP045",  # use X | None instead of Optional[X] — same as UP007
    "UP035",  # typing.Dict/List/Tuple deprecated — same as UP006
    "B904",   # raise-without-from in except — cosmetic, verbatim copies
    "E722",   # bare except — cosmetic, verbatim copies
]

[tool.ruff.lint.per-file-ignores]
# __init__.py sets up a NullHandler before deferred optional imports — E402 is intentional
"quantui/__init__.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["quantui"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pyscf.*",
    "py3Dmol.*",
    "IPython.*",
    "ipywidgets.*",
    "psutil",
    "ase.*",
    "rdkit.*",
    "plotlymol3d.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Fast-by-default: quiet output + parallel across cores (pytest-xdist). The
# full suite ran ~7 min single-threaded with coverage on every invocation;
# this keeps the common ``pytest`` loop short. Coverage is NOT on by default —
# it instruments every line and emits 3 reports. Run it explicitly when you
# want the number (CI does this in .github/workflows/ci.yml):
#   pytest --cov=quantui --cov-report=term-missing --cov-report=xml
# Debugging a single test? Run serially (one process, breakpoints work) with:
#   pytest tests/test_foo.py -n0
# Skip the slow / notebook tiers in the inner loop:
#   pytest -m "not slow and not notebook"
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "-n=auto",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring PySCF",
    "unit: marks tests as unit tests",
    "network: marks tests that require network connectivity",
    "notebook: marks notebook smoke tests",
]

[tool.coverage.run]
source = ["quantui"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
