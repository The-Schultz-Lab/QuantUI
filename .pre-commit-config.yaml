fail_fast: true

repos:
  # ── Standard file hygiene ─────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: "notebooks/"   # notebooks manage their own line endings
      - id: check-yaml
      - id: check-json
        exclude: "notebooks/"   # notebook JSON is managed by Jupyter
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
        # Bundled molecule-library package data (M-STRUCT) is intentionally
        # large and governed by its own <=10 MB budget test
        # (test_*_library.py); keep the 500 KB guard for everything else.
        exclude: "^quantui/data/"
      - id: debug-statements     # catch leftover breakpoint() / pdb calls

  # ── Strip notebook outputs before commit ─────────────────────────────────
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        files: notebooks/

  # ── Code formatting (black) ───────────────────────────────────────────────
  - repo: https://github.com/psf/black
    # Keep this rev, the `black` floor in pyproject.toml's `dev` extra, and
    # local-setup/environment.yml in lockstep. When they drift, a bare
    # `black --check` disagrees with CI — see M-CLEAN CLEAN.2.
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3
        files: ^(quantui|tests)/

  # ── Linting (ruff — superset of flake8) ──────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in lockstep with the `ruff` floor in pyproject.toml's `dev` extra and
    # local-setup/environment.yml. A ruff minor bump can enable rules that were
    # previously folded into an ignored code (UP045 split out of UP007) — when
    # bumping, run `ruff check quantui/ tests/ --statistics` and decide each new
    # code deliberately rather than letting it appear as noise.
    rev: v0.16.0
    hooks:
      - id: ruff
        args: ["--fix"]         # auto-fix safe issues (unused imports, etc.)
        files: ^(quantui|tests)/

  # ── Type checking (mypy) ─────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        stages: [pre-push]
        files: ^quantui/        # type-check the package only, not tests
        args: ["--ignore-missing-imports", "--no-error-summary"]
        additional_dependencies:
          - "numpy"
          - "types-requests"
