name: quantui
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11

  # Core Jupyter and widgets
  # Version ranges mirror pyproject.toml (runtime deps carry the same MAJOR caps;
  # dev tools the same pins) — tests/test_environment_yml.py keeps them in step.
  - jupyter>=1.0.0,<2
  - ipywidgets>=8.0.0,<9
  - notebook>=7.0.0,<8
  - ipykernel>=6.0.0,<8

  # Scientific computing
  - numpy>=1.24.0,<3
  - ase>=3.26.0,<4      # Structure I/O, molecule library, geometry optimisation (Sella needs 3.26)
  - rdkit>=2022.03.1     # PubChem SDF→XYZ conversion, SMILES input
  - xtb-python>=20.2     # GFN-FF metal-capable pre-optimization (the Python API +
                         # ASE calculator; conda-forge has Windows/macOS builds,
                         # whereas the PyPI `xtb` wheel is Linux-only)

  # Visualization
  - py3dmol>=2.0.0,<2.6 # Primary 3D molecular viewer (minor = vendored 3Dmol.js)
  - matplotlib>=3.7.0,<4
  - plotly>=5.0.0,<8    # Orbital diagrams and comparison plots
  - kaleido>=0.2.1,<2   # Static PNG export for Plotly figures

  # Web APIs (PubChem integration)
  - requests>=2.28.0,<3

  # Testing and development
  - pytest>=7.0.0
  - pytest-cov>=4.0.0
  - pytest-mock>=3.10.0
  - pytest-xdist>=3.0.0  # pyproject addopts has -n=auto; bare `pytest` fails without it
  - mypy>=1.10.0,<1.11   # = pyproject's mypy~=1.10.0 / CI's pinned mypy step
  - types-requests>=2.28.0
  - python-build>=1.0.0  # PyPI `build`; used by tests/test_packaging.py
  - setuptools>=70.1     # --no-isolation wheel build needs built-in bdist_wheel
  - nbstripout>=0.7.0    # Strip notebook outputs before git commits
  - pre-commit>=3.7.0

  # Package manager for pip dependencies
  - pip>=23.0

  - pip:
      # Voilà app server — clean widget-only UI for classroom demos
      # Capped like pyproject's [app] extra (Voila 0.6 is untested).
      - voila>=0.5.0,<0.6
      # Notebook smoke testing
      - nbmake>=1.4.0
      # Code formatting and linting (not on conda-forge). Pinned to a compatible
      # range so a fresh env matches the revs CI enforces in
      # .pre-commit-config.yaml — open floors let these drift ahead of CI, which
      # makes a bare `ruff check` report rules CI never sees (M-CLEAN CLEAN.2).
      - black~=26.5.1
      - ruff~=0.16.0
      # Install QuantUI in editable mode
      # On Linux/WSL also run: conda install -c conda-forge pyscf
      # (pyscf-properties is pip-only; installed here automatically)
      # PyPI pyscf-properties 0.1.0 is missing the infrared module and has an NMR
      # reshape bug fixed in commit 4eee5a4 (2024-11-07, unreleased).  Install
      # from GitHub source until a new release lands on PyPI.
      - pyscf-properties @ git+https://github.com/pyscf/properties.git
      # Grimme D3 for PBE-D3 (PySCF mf.disp); Linux/macOS wheels on PyPI.
      - pyscf-dispersion>=1.0
      # Transition-state search (M-TS, DEC-024); pulls in jax (~380 MB).
      - sella>=2.6
      - -e ..
