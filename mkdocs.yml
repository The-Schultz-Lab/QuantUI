site_name: QuantUI Documentation
site_description: Free, open, and interactive quantum chemistry with PySCF
site_author: Jonathan Schultz & Benjamin Lear
site_url: https://the-schultz-lab.github.io/QuantUI

repo_name: The-Schultz-Lab/QuantUI
repo_url: https://github.com/The-Schultz-Lab/QuantUI
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  logo: logo.svg
  favicon: logo.ico

extra_css:
  - stylesheets/landing.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/The-Schultz-Lab/QuantUI
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/quantui/

plugins:
  - search:
      lang: en

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".."]
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Platform Support: platforms.md
      - Tutorials: tutorials.md
  - User Guide:
      - Features: features.md
      - Gallery: gallery.md
      - Supported Methods: methods.md
      - CLI Reference: CLI.md
      - Import into Avogadro: IMPORTING-INTO-AVOGADRO.md
  - Development:
      - Changelog: changelog.md
