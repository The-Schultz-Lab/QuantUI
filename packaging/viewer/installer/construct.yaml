# QuantUI Viewer desktop installer (conda constructor) — History + Analysis
# only, no quantum engine. Built by .github/workflows/viewer-builds.yml:
#
#   QUANTUI_VERSION=0.9.0 constructor packaging/viewer/installer --output-dir out
#
# The QuantUI wheel (copied in next to this file by the workflow) is installed
# by post_install.* — QuantUI is not on conda-forge. Installers are UNSIGNED
# (no signing fee): see packaging/viewer/README.md for the one-time
# SmartScreen / Gatekeeper steps.
name: QuantUI-Viewer
version: {{ environ["QUANTUI_VERSION"] }}
company: The Schultz Lab
license_file: LICENSE
channels:
  - conda-forge
specs:
  - python 3.11.*
  - pip
  - voila >=0.5,<0.6
  - ipykernel
  - ipywidgets >=8,<9
  - numpy
  # OpenBLAS, not MKL: on win-64 conda-forge's numpy otherwise resolves to MKL,
  # ~115 MB compressed and several hundred MB installed, for a viewer that
  # does no heavy linear algebra. Measured with a conda-forge solve
  # (2026-11-08): Windows download 284 -> 170 MB from this line alone.
  - libblas=*=*openblas
  - matplotlib-base
  - plotly
  - py3dmol
  - requests
# Pandoc (~25 MB compressed, ~100 MB installed) arrives only through the
# `nbconvert` metapackage Voila requires; Voila renders notebooks with
# nbconvert-core's HTML exporter and never calls pandoc. JupyterLab itself is
# not in this environment (only jupyterlab_server). The installer smoke test
# (smoke_launch.py, viewer-builds.yml) launches and renders the viewer, so a
# missing runtime dependency fails CI rather than a student's install.
exclude:
  - pandoc
  - nbconvert-pandoc
extra_files:
  - quantui-{{ environ["QUANTUI_VERSION"] }}-py3-none-any.whl
  - create_shortcuts.ps1  # [win]
post_install: post_install.sh  # [unix]
post_install: post_install.bat  # [win]
installer_type: sh  # [linux]
installer_type: pkg  # [osx]
installer_type: exe  # [win]
# Per-user install; never touch the user's shell, PATH or registry Python.
register_python: false
initialize_conda: false
initialize_by_default: false
