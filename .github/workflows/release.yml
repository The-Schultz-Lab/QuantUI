name: Release

# M-PYPI PYPI.6. Two triggers:
#
#   - A GitHub Release being published (the normal path — PYPI.7): build,
#     publish to TestPyPI as a sanity check, then publish to PyPI.
#   - workflow_dispatch: manually run the build+TestPyPI publish WITHOUT
#     touching production PyPI. Use this to rehearse the pipeline (e.g. a
#     pyproject.toml packaging change) without cutting a real release.
#
# Trusted Publishing (OIDC) is used throughout — no PyPI/TestPyPI API token is
# stored in this repo. Each publish job authenticates as itself via
# `id-token: write` and a GitHub Environment (`testpypi` / `pypi`) that must be
# registered as that environment's Trusted Publisher on the corresponding
# index. See TODO/roadmaps/23-m-pypi-publishing-roadmap.md PYPI.5.

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  # ── Build once, reuse the same artifact everywhere ───────────────────────
  # Building only once (rather than in each publish job) guarantees the exact
  # bytes published to TestPyPI are the exact bytes published to PyPI — no
  # window for the source tree to change between the two.
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify metadata (twine check)
        run: twine check dist/*

      - name: Verify importable from the wheel alone
        # Installs ONLY from dist/ (no -e ., no repo on sys.path), so a
        # packaging mistake that "works" via the editable install but would
        # break a real `pip install quantui` is caught here.
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl
          /tmp/wheel-check/bin/python -c "import quantui; print(quantui.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ── TestPyPI — always, on every trigger ──────────────────────────────────
  # Runs even for a real release, immediately before the PyPI publish, so a
  # broken build is caught on the sandbox index first rather than on the
  # first production publish attempt.
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/quantui/
    permissions:
      id-token: write  # OIDC for Trusted Publishing — no token in secrets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI does not allow re-uploading a version, and a rehearsal
          # run (workflow_dispatch) will often hit an already-published
          # version. Skip rather than fail the job in that case.
          skip-existing: true

  # ── PyPI — only for an actual published Release ──────────────────────────
  # workflow_dispatch intentionally has no path to this job: a manual
  # rehearsal run must NEVER be able to publish to production PyPI, so the
  # `if` below excludes it rather than relying on environment protection
  # alone as the only safeguard.
  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    environment:
      # Configure this environment with a required reviewer in the repo's
      # Settings → Environments, so a tag push builds the release but a human
      # approves the actual publish to production PyPI.
      name: pypi
      url: https://pypi.org/project/quantui/
    permissions:
      id-token: write  # OIDC for Trusted Publishing — no token in secrets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        # No repository-url: the action's default IS pypi.org. PyPI (unlike
        # TestPyPI) rejects re-uploading a version outright, so a real
        # duplicate-version mistake fails loudly here rather than being
        # silently skipped.
